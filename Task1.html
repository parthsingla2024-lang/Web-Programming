<html>
<head>
    <title>Online Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .quiz-container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        .option {
            margin: 10px 0;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #score {
            font-size: 28px;
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="quiz-container">
    <h2 id="question"></h2>

    <div class="option">
        <input type="radio" name="answer" value="0"> <span id="opt0"></span>
    </div>
    <div class="option">
        <input type="radio" name="answer" value="1"> <span id="opt1"></span>
    </div>
    <div class="option">
        <input type="radio" name="answer" value="2"> <span id="opt2"></span>
    </div>
    <div class="option">
        <input type="radio" name="answer" value="3"> <span id="opt3"></span>
    </div>

    <button id="btn" onclick="handleClick()">Next</button>
</div>

<script>
    const quiz = [
        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Text Machine Language",
                "Hyperlink Text Markup Language",
                "Home Tool Markup Language"
            ],
            answer: 0
        },
        {
            question: "Which language is used for styling web pages?",
            options: ["HTML", "CSS", "JavaScript", "Python"],
            answer: 1
        },
        {
            question: "Which is used for web scripting?",
            options: ["HTML", "CSS", "JavaScript", "SQL"],
            answer: 2
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
        let q = quiz[currentQuestion];
        document.getElementById("question").innerText = q.question;
        document.getElementById("opt0").innerText = q.options[0];
        document.getElementById("opt1").innerText = q.options[1];
        document.getElementById("opt2").innerText = q.options[2];
        document.getElementById("opt3").innerText = q.options[3];

        document.getElementById("btn").innerText =
            currentQuestion === quiz.length - 1 ? "Submit" : "Next";

        let radios = document.getElementsByName("answer");
        for (let r of radios) r.checked = false;
    }

    function handleClick() {
        let selected = document.querySelector('input[name="answer"]:checked');

        if (!selected) {
            alert("Please select an answer!");
            return;
        }

        if (parseInt(selected.value) === quiz[currentQuestion].answer) {
            score++;
        }

        currentQuestion++;

        if (currentQuestion < quiz.length) {
            loadQuestion();
        } else {
            document.querySelector(".quiz-container").innerHTML =
                `<h2>Quiz Completed</h2>
                 <div id="score">Your Score: ${score} / ${quiz.length}</div>`;
        }
    }

    loadQuestion();
</script>

</body>
</html>
